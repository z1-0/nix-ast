name: Cachix

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cachix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cachix:
    name: Cachix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Run Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: z1-0
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build with Nix
        run: nix build --print-build-logs
